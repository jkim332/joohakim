<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jooha Kim – Data Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--head:#1e27a5;--text:#111111;--muted:#525252;--accent:#2dc0d3;
  --tagbg:rgba(0,65,194,.1);--card:rgba(0,65,194,.05);--line:#e5e7eb;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
strong{color:var(--accent);font-weight:600}
.skip{position:absolute;left:16px;top:-60px;background:var(--accent);color:#fff;padding:8px 12px;border-radius:6px;font-weight:600;z-index:60}
.skip:focus{top:12px}
#glow{pointer-events:none;position:fixed;inset:0;z-index:30;background:radial-gradient(300px at var(--mx,25%) var(--my,20%),rgba(219,234,254,.4),transparent 80%)}
.wrap{max-width:860px;margin:0 auto;padding:56px 24px 96px}
header{padding-bottom:28px;margin-bottom:56px;border-bottom:1px solid var(--line);text-align:center}
header > div{display:flex;flex-direction:column;align-items:center}
header h1{margin:0;font-size:2.5rem;line-height:1.1;font-weight:700;color:var(--head);letter-spacing:-.02em}
header h2{margin:12px 0 0;font-size:1.2rem;font-weight:500;color:var(--head)}
header p{margin:16px 0 0;max-width:32rem}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 28px;margin-top:28px}
nav a{padding:6px 0;border-bottom:2px solid transparent;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:color .2s,border-color .2s}
nav a:hover,nav a.active{color:var(--head);border-bottom-color:var(--head)}
.socials{display:flex;justify-content:center;gap:20px;margin:24px 0 0;padding:0;list-style:none}
.socials a{display:block;color:var(--text)}
.socials a:hover{color:var(--accent)}
.socials svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
section{margin-bottom:80px;scroll-margin-top:24px}
.sec-title{margin:0 0 24px;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--head)}
#about p{margin:0 0 16px}
.list{list-style:none;margin:0;padding:0}
#exp .item{position:relative;display:grid;gap:8px;padding-bottom:48px;transition:none}
#proj .item{position:relative;display:grid;gap:8px;padding-bottom:48px;transition:opacity .2s}
#proj .item::before{content:"";position:absolute;inset:-16px -24px;border-radius:8px;background:transparent;transition:background .2s;z-index:-1}
#proj:hover .item:not(:hover){opacity:.55}
.dates{margin-top:4px;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.item h3{margin:0;font-size:1rem;line-height:1.4;font-weight:600;color:var(--head)}
.item h3 svg{display:inline-block;width:12px;height:12px;margin-left:6px;vertical-align:baseline;fill:none;stroke:currentColor;stroke-width:2.5;transition:transform .2s}
.item h3 a::after{content:"";position:absolute;inset:-16px -24px;border-radius:8px}
.roles{margin:0;font-size:.95rem;line-height:1.4;color:var(--muted)}
.item p{margin:8px 0 0;font-size:.875rem;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.tags li{padding:4px 12px;border-radius:999px;background:var(--tagbg);color:var(--accent);font-size:.75rem;font-weight:500;line-height:1.5}
.thumb{width:100%;aspect-ratio:16/10;border-radius:4px;border:2px solid rgba(0,0,0,.12);object-fit:cover;background:linear-gradient(135deg,#f1f5f9,#e2e8f0);display:grid;place-items:center;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;transition:border-color .2s}
#proj .item:hover .thumb{border-color:rgba(0,0,0,.3)}
#proj .item:hover::before{background:var(--card)}
#proj .item:hover h3,#proj .item:hover h3 a{color:var(--accent)}
#proj .item:hover h3 svg{transform:translate(3px,-3px)}
footer{max-width:28rem;font-size:.875rem;color:var(--muted)}
footer a{color:var(--text)}footer a:hover{color:var(--accent)}
.scroll-top{display:none;position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:40;width:42px;height:42px;border:none;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);cursor:pointer;place-items:center;color:var(--accent)}
.scroll-top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.scroll-top:hover{background:#f8fafc}
@media(min-width:640px){
  .item{grid-template-columns:1fr 3fr;gap:16px}
  .item .thumb{grid-column:1;grid-row:1}
  .item .body{grid-column:2}
  .item.proj{grid-template-columns:1fr 2fr}
}
@media(min-width:768px){.wrap{padding:72px 48px 96px}header h1{font-size:3.5rem}}
@media(min-width:1024px){.scroll-top{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div id="glow" aria-hidden="true"></div>
<button class="scroll-top" id="scrollTop" aria-label="Scroll to top" title="Scroll to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6"/><path d="m6 12 6-6 6 6"/></svg></button>
<div class="wrap">
  <header>
    <div>
      <h1 id="name"></h1>
      <h2 id="title"></h2>
      <p id="tagline"></p>
      <nav aria-label="In-page jump links" id="nav"></nav>
    </div>
    <ul class="socials" id="socials" aria-label="Social media"></ul>
  </header>
  <main id="content">
    <section id="about" aria-label="About me"><h2 class="sec-title">About</h2><div id="about-body"></div></section>
    <section id="experience" aria-label="Work experience"><h2 class="sec-title">Experience</h2><ol class="list" id="exp"></ol></section>
    <section id="projects" aria-label="Selected projects"><h2 class="sec-title">Projects</h2><ul class="list" id="proj"></ul></section>
    <footer id="foot"></footer>
  </main>
</div>

/* ================== EDITABLE CONTENT ================== */
<script>
const SITE = {
  name: "Jooha Kim",
  title: "Data Engineer",
  resumeUrl: "#",                      // link to resume 
  socials: [                           // icons: github, linkedin mail
    { label: "GitHub",    icon: "github",    url: "#" },
    { label: "LinkedIn",  icon: "linkedin",  url: "https://www.linkedin.com/in/joohakim/" },
    { label: "Email",     icon: "mail",      url: "mailto:j332kim@naver.com" }
  ],
  about: [
    "Hello, thank you for visiting!",

    "I’m a Data Engineer who enjoys designing, building, and connecting data systems. I’m interested in the bigger picture of data engineering — from data collection and transformation to building reliable and efficient pipelines.",

    "I’m always learning and exploring better ways to build and maintain data systems. This portfolio is a collection of what I’ve built, what I’m learning, and what I’m exploring along the way.",

    "안녕하세요, 방문해주셔서 감사합니다!",

    "데이터 시스템을 설계하고, 구축하고, 통합시키는 일을 좋아하는 데이터 엔지니어입니다. 데이터 수집과 안정적이고 효율적인 파이프라인 구축까지, 데이터의 전체 흐름을 이해하고 개선하는데 관심이 많습니다.",

    "항상 더 나은 방법을 배우고 시도하며 데이터 엔지니어로 성장하고 있습니다. 이 포트폴리오에는 제가 만든 프로젝트와 배우고 있는 것들을 하나씩 기록하고 있습니다."
  ],
  experience: [
    { dates: "Jan 2022 — Present", title: "Data Engineer", company: "NielsenIQ",
      description: ["Developed and operated large-scale data pipelines supporting multi-terabyte daily data preparation and client delivery workflows, while improving process automation, delivery reliability, monitoring, deployment efficiency, and legacy pipeline performance.",
      "대규모 데이터 파이프라인의 설계 및 운영을 담당하며 일일 대용량 데이터 처리와 고객 데이터 전달을 지원하고, 업무 자동화와 데이터 전달 안정성, 모니터링, 배포 효율성 및 레거시 파이프라인을 지속적으로 개선."],
      tags: ["Python", "Airflow", "Snowflake", "Databricks", "AWS", "SQL", "Jenkins"] },
    { dates: "May 2018 — Jan 2022", title: "Data Analytics Engineer", company: "Royal Bank of Canada",
      description: ["Developed and automated enterprise data pipelines and data lake solutions supporting operational and regulatory risk reporting, automated reporting workflows, and partnered with analysts, risk, and technology teams to deliver scalable data solutions.",
      "기업 전반의 데이터를 활용한 대규모 데이터 파이프라인과 데이터 레이크를 구축/운영하여 운영 및 규제 리스크 리포팅을 지원하고, 리포팅 업무를 자동화하며 분석·리스크·기술팀과 협업해 확장 가능한 데이터 솔루션을 제공."],
      tags: ["Python", "PySpark", "Airflow", "Hadoop", "HIVE", "Tableau"] },
    { dates: "May 2017 — Dec 2017", title: "Data Scientist Intern", company: "Royal Bank of Canada",
      description: ["Built automated dashboarding solutions to support operational risk monitoring and reporting.",
      "운영 리스크 모니터링과 리포팅을 지원하기 위해 자동화된 대시보드 솔루션을 구축."],
      tags: ["Python", "Tableau"] }
  ],
  projects: [
    { title: "Project One", url: "#", image: "",     // image: paste an image URL or leave blank
      description: "A short description of the project, what problem it solves, and what you built.",
      tags: ["React", "Node.js"] },
    { title: "Project Two", url: "#", image: "",
      description: "Another project. Keep it to two or three sentences.",
      tags: ["TypeScript", "Next.js"] }
  ],
};
/* ================== END OF EDITABLE CONTENT ================== */

const ICONS = {
  github:'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
  linkedin:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
  codepen:'<polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/><polyline points="2 15.5 12 8.5 22 15.5"/><line x1="12" y1="2" x2="12" y2="8.5"/>',
  instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
  twitter:'<path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>',
  mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/>'
};
const ARROW = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10 10 2M4 2h6v6"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const $ = id => document.getElementById(id);
const tags = t => t && t.length ? `<ul class="tags" aria-label="Technologies used">${t.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';

document.title = `${SITE.name} – ${SITE.title}`;
$('name').textContent = SITE.name;
$('title').textContent = SITE.title;
$('tagline').textContent = SITE.tagline;
$('about-body').innerHTML = SITE.about.map(p => `<p>${rich(p)}</p>`).join('');

const scrollTopButton = $('scrollTop');
scrollTopButton.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const toggleScrollTopButton = () => {
  scrollTopButton.style.display = window.scrollY > 200 ? 'grid' : 'none';
};
window.addEventListener('scroll', toggleScrollTopButton);
toggleScrollTopButton();

$('nav').innerHTML = ['about','experience','projects'].map(id =>
  `<a href="#${id}" data-id="${id}">${id}</a>`).join('');

$('socials').innerHTML = SITE.socials.map(s =>
  `<li><a href="${esc(s.url)}" target="_blank" rel="noreferrer noopener" aria-label="${esc(s.label)}" title="${esc(s.label)}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.icon] || ICONS.mail}</svg></a></li>`).join('');

$('exp').innerHTML = SITE.experience.map(j => `
  <li class="item">
    <div class="dates">${esc(j.dates)}</div>
    <div class="body">
      <h3>${esc(j.title)} · ${esc(j.company)}</h3>
      ${(j.roles||[]).map(r => `<div class="roles">${esc(r)}</div>`).join('')}
      ${(Array.isArray(j.description) ? j.description : [j.description]).map(d => `<p>${rich(d)}</p>`).join('')}
      ${tags(j.tags)}
    </div>
  </li>`).join(''); 

$('proj').innerHTML = SITE.projects.map(p => `
  <li class="item proj">
    ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="Screenshot of ${esc(p.title)}">` : `<div class="thumb" aria-hidden="true">Image</div>`}
    <div class="body">
      <h3><a href="${esc(p.url)}" target="_blank" rel="noreferrer noopener">${esc(p.title)}${ARROW}</a></h3>
      <p>${rich(p.description)}</p>
      ${tags(p.tags)}
    </div>
  </li>`).join('');

/* Highlight the nav link for the section in view */
const links = [...document.querySelectorAll('#nav a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(l => l.classList.toggle('active', l.dataset.id === e.target.id));
}), { rootMargin: '-35% 0px -60% 0px' });
document.querySelectorAll('main section').forEach(s => io.observe(s));

/* Soft blue spotlight that follows the cursor */
addEventListener('pointermove', e => {
  const glow = $('glow').style;
  glow.setProperty('--mx', e.clientX + 'px');
  glow.setProperty('--my', e.clientY + 'px');
});

</script>
</body>
</html>
